spring:
  application:
    name: board-game-buddy

  ai:
    model:
      chat: ollama
      embedding: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:qwen2.5:0.5b}
        temperature: ${OLLAMA_TEMPERATURE:0.3}
      init:
        pull-model-strategy: never

logging:
  level:
    org:
      zalando:
        logbook: TRACE

logbook:
  format:
    style: http
