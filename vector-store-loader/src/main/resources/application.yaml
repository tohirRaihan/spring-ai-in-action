spring:
  application:
    name: vector-store-loader
  cloud:
    function:
      definition: fileSupplier|documentReader|splitter|titleDeterminer|vectorStoreConsumer
  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:qwen2.5:0.5b}
        temperature: 0.3
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      init:
        pull-model-strategy: never
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        initialize-schema: true
        collection-name: GameRules

file:
  supplier:
    directory: ${DROP_OFF_DIRECTORY:./dropoff}
    filename-regex: '(?i).*\.(pdf|docx|txt)$'
    prevent-duplicates: true
  consumer:
    mode: ref

server:
  port: ${SERVER_PORT:9111}
